name: compile test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: sysinfo
      run: echo -en '\e[33;1mThread count:\e[0m ' && nproc && free -h
    - name: install dependency tooling
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y equivs dos2unix
    - name: build dependency package
      run: equivs-build duris-build-deps.equivs
    - name: install build dependencies
      run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./duris-build-deps_1.0_all.deb
    - name: build DMS
      run: make -j$(nproc) -C src
    - name: build DE
      run: make -j$(nproc) -C areas/de/src
    - name: build areas
      run: make -j$(nproc) -C areas/src && cd areas && ./m_slow
